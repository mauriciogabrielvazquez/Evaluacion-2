<!DOCTYPE html>
<html lang="es">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:3000 http://192.168.100.11:3000 ws://localhost:3000 ws://192.168.100.11:3000 https://cdn.socket.io; script-src 'self' 'unsafe-inline' https://cdn.socket.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; media-src 'self';">
